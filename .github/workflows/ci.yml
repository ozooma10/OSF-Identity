name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-checks:
    name: Host checks (Linux)
    runs-on: ubuntu-latest
    # Pushes already cover every same-repo branch, so the pull_request event is only needed for forks. Without this the two events double every run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Parsers, fixture validator, and the provenance gate:
      # fast feedback that does not need the game toolchain.
      - name: Run host verification
        run: ./tools/verify-host.sh

  windows-build:
    name: Build and verify (Windows)
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # CommonLibSF, and its own commonlib-shared submodule.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ runner.os }}-${{ hashFiles('xmake.lua', 'lib/commonlibsf/xmake.lua', 'lib/commonlibsf/lib/commonlib-shared/xmake.lua') }}
          restore-keys: |
            xmake-${{ runner.os }}-

      - name: Run full verification
        shell: pwsh
        run: ./tools/verify.ps1

      - name: Build production package
        shell: pwsh
        run: ./tools/build-release.ps1 -SkipVerify

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: OSF-Identity-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
