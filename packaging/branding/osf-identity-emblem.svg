<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>OSF Identity biometric profile emblem</title>
  <desc>Three offset human profile contours crossed by a violet biometric scan line, with diamond endpoints and a ringed identity node.</desc>

  <!-- alternate appearances: restrained rear contours behind the active profile -->
  <g fill="none" stroke="#7052a8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 128 C176 140 151 181 157 232 C162 282 185 316 222 334" stroke-width="4" stroke-opacity="0.28"/>
    <path d="M290 128 C336 140 361 181 355 232 C350 282 327 316 290 334" stroke-width="4" stroke-opacity="0.28"/>
  </g>

  <!-- active identity -->
  <g fill="none" stroke="#9570d1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 108 C204 108 176 150 181 211 C186 273 212 312 256 330 C300 312 326 273 331 211 C336 150 308 108 256 108 Z" stroke-width="6"/>
    <path d="M174 397 C184 354 214 327 256 327 C298 327 328 354 338 397" stroke-width="6"/>
  </g>

  <!-- targeting brackets -->
  <g fill="none" stroke="#7459a7" stroke-width="4" stroke-linecap="round">
    <path d="M120 165 V94 H191"/><path d="M392 165 V94 H321"/>
    <path d="M120 347 V418 H191"/><path d="M392 347 V418 H321"/>
  </g>

  <!-- biometric scan -->
  <line x1="105" y1="229" x2="407" y2="229" stroke="#9570d1" stroke-width="6" stroke-linecap="round"/>
  <g fill="#bda7ed">
    <path d="M105 218 L116 229 L105 240 L94 229 Z"/>
    <path d="M407 218 L418 229 L407 240 L396 229 Z"/>
  </g>
  <g fill="none" stroke="#7052a8">
    <circle cx="256" cy="229" r="24" stroke-width="3" stroke-opacity="0.55"/>
    <circle cx="256" cy="229" r="39" stroke-width="2.4" stroke-opacity="0.30"/>
    <circle cx="256" cy="229" r="55" stroke-width="2" stroke-opacity="0.16"/>
  </g>
  <circle cx="256" cy="229" r="11" fill="#0b0e12" stroke="#bda7ed" stroke-width="4"/>
  <circle cx="256" cy="229" r="4" fill="#eee8ff"/>
</svg>
